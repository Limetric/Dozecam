# The Xcode project is generated from this file (XcodeGen) and never committed:
# run ios/tools/generate.sh. See ios/AGENTS.md.
name: Dozecam
options:
  bundleIdPrefix: app.dozecam
  deploymentTarget:
    # 26.1, not 26.0: AlarmKit's Alert(title:secondaryButton:…) — the alert
    # path #58 chose — starts there.
    iOS: "26.1"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
  # The dev variant, app.dozecam.dev ("Dozecam Dev"), installs beside the
  # app relied on at night.
  Dev: debug
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
  Dev: Config/Version.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: 2NBQ276R8F
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Deliberately not SWIFT_DEFAULT_ACTOR_ISOLATION=MainActor: realtime audio
    # and libVLC callbacks must never inherit MainActor isolation (#58).
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  # Live view (#59, #66). VideoLAN distributes VLCKit 4 through SPM as a
  # binaryTarget but tags no SPM version, so it is pinned by revision.
  # LGPL-2.1: see ios/AGENTS.md.
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    revision: 6cbc4e7b248aa51ec0906697abb30ecae47194b7 # "Distribute 4.0.0a24 via cocoapods and SPM"
targets:
  Dozecam:
    type: application
    platform: iOS
    sources:
      - path: Dozecam
        excludes:
          - Player/libvlc/**
    dependencies:
      - package: VLCKit
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Dozecam/Dozecam.entitlements
        # libVLC's C API, for the livestream's media callbacks. Its headers
        # ship inside VLCKit.framework but outside its module map; a copy from
        # the same 4.0.0a24 binary lives in Player/libvlc.
        SWIFT_OBJC_BRIDGING_HEADER: Dozecam/Player/Dozecam-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Dozecam/Player/libvlc
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.dozecam
          APP_DISPLAY_NAME: Dozecam
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.dozecam
          APP_DISPLAY_NAME: Dozecam
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: app.dozecam.dev
          APP_DISPLAY_NAME: Dozecam Dev
    info:
      path: Dozecam/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Keeps monitoring alive with the screen locked (#58: .playback with
        # .mixWithOthers).
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Dozecam plays your cameras and talks to your UniFi Protect console on your local network.
        NSMicrophoneUsageDescription: Dozecam uses the microphone when you talk to the room through a camera.
        NSAlarmKitUsageDescription: Dozecam sounds an alarm when a room gets loud or monitoring stops, even in silent mode and Sleep Focus.
        # iPad: every orientation, so Split View and Stage Manager can resize
        # the app freely.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Consoles present self-signed certificates and are trusted by pinning
        # (shared/spec/protect.md), under whatever name the user reaches them
        # by: an IP, a .local name, or a qualified DNS name, which
        # NSAllowsLocalNetworking does not cover (ATS then fails the TLS
        # handshake, -1200, before the pinning delegate can accept it). HTTPS
        # stays mandatory in code: ProtectApiClient.baseURL rejects any other
        # scheme. Alone on purpose: iOS ignores NSAllowsArbitraryLoads when
        # NSAllowsLocalNetworking is also present.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Dozecam/Dozecam.entitlements
      properties:
        # Critical Alerts needs Apple's approval and comes with a public
        # release (#71); automatic signing syncs this one to the App ID.
        com.apple.developer.usernotifications.time-sensitive: true
  DozecamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DozecamTests
    dependencies:
      - target: Dozecam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dozecam.tests
        GENERATE_INFOPLIST_FILE: YES
        # @testable import Dozecam re-reads the app's bridging header.
        HEADER_SEARCH_PATHS: $(SRCROOT)/Dozecam/Player/libvlc
schemes:
  Dozecam:
    build:
      targets:
        Dozecam: all
        DozecamTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [DozecamTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Dozecam Dev:
    build:
      targets:
        Dozecam: all
        DozecamTests: [test]
    run:
      config: Dev
    test:
      config: Dev
      targets: [DozecamTests]
    profile:
      config: Dev
    analyze:
      config: Dev
    archive:
      config: Dev
