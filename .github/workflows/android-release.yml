name: Android Release

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARTIFACT_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
      APP_VERSION_NAME: ${{ github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The version code counts commits, so the full history has to be here.
          fetch-depth: 0

      - name: Compute Android version code
        id: android_version
        run: echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Decrypt signing artifacts
        env:
          LIMETRIC_ENCRYPTION_SECRET: ${{ secrets.LIMETRIC_ENCRYPTION_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${LIMETRIC_ENCRYPTION_SECRET}" ]; then
            echo "::error::LIMETRIC_ENCRYPTION_SECRET is not configured."
            exit 1
          fi

          ./tools/signing.sh decrypt

      # One flavor is enough: production and dev differ only in application id
      # and launcher label, and two Robolectric suites at once are just slower.
      - name: Run unit tests
        run: ./gradlew :app:testProductionDebugUnitTest --stacktrace

      - name: Build release APK and AAB
        env:
          APP_VERSION_CODE: ${{ steps.android_version.outputs.code }}
        run: ./gradlew :app:assembleProductionRelease :app:bundleProductionRelease --stacktrace

      - name: Collect release artifacts
        run: |
          set -euo pipefail

          version="${ARTIFACT_VERSION//\//-}"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/production/release/app-production-release.apk \
            "release-artifacts/Dozecam-${version}.apk"
          cp app/build/outputs/bundle/productionRelease/app-production-release.aab \
            "release-artifacts/Dozecam-${version}.aab"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dozecam-release-artifacts
          path: release-artifacts/*
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload "${{ github.event.release.tag_name }}" release-artifacts/* \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Extract Play Store release notes
        if: github.event_name == 'release'
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail

          printf '%s' "${RELEASE_BODY}" | python3 tools/release/extract_play_store_notes.py \
            --output-dir distribution/whatsnew

      - name: Publish AAB to Google Play
        if: github.event_name == 'release'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.dozecam
          releaseFiles: app/build/outputs/bundle/productionRelease/app-production-release.aab
          releaseName: ${{ github.event.release.tag_name }}
          mappingFile: app/build/outputs/mapping/productionRelease/mapping.txt
          whatsNewDirectory: distribution/whatsnew
          track: internal
          status: completed
