name: OpenCode Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  opencode-review:
    if: >
      (github.event.pull_request.draft == false)
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Bun dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Copy example environment files
        env:
          CLOUD_ENVIRONMENT: true
        run: ./copyExampleEnvFiles.sh

      # ChatGPT OAuth tokens rotate on refresh, so the auth file is persisted
      # via the actions cache (unique key per run, prefix restore) and only
      # seeded from the secret when no cached copy exists. PR-scoped caches
      # can only read default-branch caches, so the keepalive workflow on
      # main (opencode-auth-keepalive.yml) is what keeps the lineage fresh.
      - name: Restore opencode auth
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/share/opencode/auth.json
          key: opencode-auth-${{ github.run_id }}
          restore-keys: |
            opencode-auth-

      - name: Seed opencode auth if missing
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          if [ ! -s "$HOME/.local/share/opencode/auth.json" ]; then
            if [ -z "$OPENCODE_AUTH_JSON" ]; then
              echo "No cached opencode auth and OPENCODE_AUTH_JSON secret is empty" >&2
              exit 1
            fi
            mkdir -p "$HOME/.local/share/opencode"
            printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
            chmod 600 "$HOME/.local/share/opencode/auth.json"
          fi

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openai/gpt-5.6-sol
          variant: medium
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request with awareness of prior review rounds.

            Before leaving feedback:
            - Read the PR description and existing PR comments or review feedback.
            - Use recent commit history and the current diff to understand what changed since earlier review rounds.
            - Treat previously addressed comments as resolved unless the underlying issue is still present in the current code.
            - Do not repeat comments that were already addressed in later commits unless the problem remains.
            - Do not look for replacement findings merely because earlier findings were addressed.

            Report only material problems introduced or made worse by this pull request.

            A finding is worth reporting only when:
            - It has a realistic failure scenario supported by the changed code.
            - Its impact is correctness, security, data integrity, a user-visible regression, or a significant performance or operational problem.
            - You are highly confident the issue is real after checking the surrounding code.
            - The author would reasonably want to fix it before merging.

            Do NOT post:
            - Summaries of what the PR does
            - Praise, approval, or "looks good" remarks
            - Optional improvements, speculative edge cases, theoretical future concerns, or defensive hardening without a demonstrated risk
            - Generic requests for more tests, validation, types, comments, logging, refactoring, or abstraction
            - Maintainability, consistency, style, or preference suggestions unless the current code creates a concrete and material defect risk
            - Pre-existing problems that this pull request does not worsen
            - Questions the author can answer from the diff or existing context
            - Duplicate or already-resolved comments

            A missing test is a finding only when you can identify important behavior that is incorrect or likely to regress, not merely because changed code lacks a test.

            For each finding, cite the file or location, state the concrete failure scenario and impact, and recommend a specific change. If you cannot state the scenario and impact clearly, omit the finding.

            Return at most the three highest-impact findings. It is better to return no findings than a low-confidence or low-impact finding.

            Your final message must contain only the findings. If you find no qualifying issues, your final message must be exactly one line: No actionable feedback.

            Use `gh pr view`, `gh pr diff`, and other read-only `gh pr` commands as needed to inspect prior feedback.

            Do not post to GitHub yourself (no `gh pr comment`, no review or issue APIs): this workflow publishes your final message as the PR comment. Put the full review in your last reply only.

      # Runs even when the review fails so a token refreshed mid-run is never lost
      - name: Save opencode auth
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.local/share/opencode/auth.json
          key: opencode-auth-${{ github.run_id }}
